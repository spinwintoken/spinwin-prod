<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SpinWheel Comparison</title>
<style>
  body {
    background:#000;
    color:#ffd700;
    font-family:Arial;
    text-align:center;
    padding-bottom:60px;
  }

  h2 { margin-top:40px; }

  canvas {
    background:#111;
    border:3px solid #ffd700;
    border-radius:50%;
    margin-top:20px;
  }

  .pointer {
    width:0;
    height:0;
    border-left:20px solid transparent;
    border-right:20px solid transparent;
    border-bottom:30px solid red;
    margin:0 auto;
    margin-top:10px;
  }
</style>
</head>
<body>

<h2>Wheel A + B (Equal slices + Different colors)</h2>
<div class="pointer"></div>
<canvas id="wheelAB" width="320" height="320"></canvas>
<button onclick="spinAB()" style="margin-top:20px;font-size:20px;">SPIN A+B</button>

<h2>Wheel C (Gold Gradient)</h2>
<div class="pointer"></div>
<canvas id="wheelC" width="320" height="320"></canvas>
<button onclick="spinC()" style="margin-top:20px;font-size:20px;">SPIN C</button>

<script>
/* ----------------------------------------------------------
   62 SLOT WHEEL DATA
---------------------------------------------------------- */
const wheelSlots = [
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(65+i)),
  ...Array.from({length:26}, (_,i)=>String.fromCharCode(97+i)),
  ...Array.from({length:10}, (_,i)=>String(i))
];

/* ----------------------------------------------------------
   DRAW WHEEL A+B (equal slices + different colors)
---------------------------------------------------------- */
const canvasAB = document.getElementById("wheelAB");
const ctxAB = canvasAB.getContext("2d");
const radiusAB = 160;

function drawWheelAB(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctxAB.beginPath();
    ctxAB.moveTo(radiusAB, radiusAB);
    ctxAB.arc(radiusAB, radiusAB, radiusAB, start, end);

    // alternating colors
    ctxAB.fillStyle = i % 2 === 0 ? "#2a2a2a" : "#444";
    ctxAB.fill();

    ctxAB.strokeStyle = "#ffd700";
    ctxAB.stroke();

    ctxAB.save();
    ctxAB.translate(radiusAB, radiusAB);
    ctxAB.rotate(start + slice / 2);
    ctxAB.textAlign = "right";
    ctxAB.fillStyle = "#ffd700";
    ctxAB.font = "14px Arial";
    ctxAB.fillText(wheelSlots[i], radiusAB - 10, 5);
    ctxAB.restore();
  }
}

drawWheelAB();

/* ----------------------------------------------------------
   DRAW WHEEL C (gold gradient)
---------------------------------------------------------- */
const canvasC = document.getElementById("wheelC");
const ctxC = canvasC.getContext("2d");
const radiusC = 160;

function drawWheelC(rotation=0) {
  const slice = (2 * Math.PI) / wheelSlots.length;

  for (let i = 0; i < wheelSlots.length; i++) {
    const start = i * slice + rotation;
    const end = start + slice;

    ctxC.beginPath();
    ctxC.moveTo(radiusC, radiusC);
    ctxC.arc(radiusC, radiusC, radiusC, start, end);

    // gold gradient
    const grad = ctxC.createLinearGradient(0,0,320,320);
    grad.addColorStop(0, "#f7d44c");
    grad.addColorStop(1, "#b38b00");
    ctxC.fillStyle = grad;
    ctxC.fill();

    ctxC.strokeStyle = "#ffd700";
    ctxC.stroke();

    ctxC.save();
    ctxC.translate(radiusC, radiusC);
    ctxC.rotate(start + slice / 2);
    ctxC.textAlign = "right";
    ctxC.fillStyle = "#000";
    ctxC.font = "14px Arial";
    ctxC.fillText(wheelSlots[i], radiusC - 10, 5);
    ctxC.restore();
  }
}

drawWheelC();

/* ----------------------------------------------------------
   SPIN ANIMATION (shared)
---------------------------------------------------------- */
function animateSpin(canvas, ctx, radius, drawFunc, targetValue) {
  return new Promise(resolve => {
    let angle = 0;
    let speed = 0.35;

    const targetIndex = wheelSlots.indexOf(targetValue);
    const slice = (2 * Math.PI) / wheelSlots.length;
    const targetAngle = (2 * Math.PI * 4) + (slice * targetIndex);

    function frame() {
      angle += speed;
      speed *= 0.985;

      drawFunc(angle);

      if (angle >= targetAngle) resolve();
      else requestAnimationFrame(frame);
    }

    frame();
  });
}

/* ----------------------------------------------------------
   SPIN WHEEL A+B
---------------------------------------------------------- */
function spinAB() {
  const value = wheelSlots[Math.floor(Math.random() * wheelSlots.length)];
  animateSpin(canvasAB, ctxAB, radiusAB, drawWheelAB, value);
}

/* ----------------------------------------------------------
   SPIN WHEEL C
---------------------------------------------------------- */
function spinC() {
  const value = wheelSlots[Math.floor(Math.random() * wheelSlots.length)];
  animateSpin(canvasC, ctxC, radiusC, drawWheelC, value);
}
</script>

</body>
</html>
