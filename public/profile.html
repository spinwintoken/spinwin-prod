<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Profile - SpinWinToken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body {
    background:#000;
    color:#ffd700;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    padding-bottom:90px;
  }

  .block {
    background:#111;
    border:1px solid #ffd700;
    border-radius:14px;
    padding:20px;
    width:90%;
    max-width:420px;
    margin:20px auto;
    text-align:left;
  }

  .title {
    font-size:22px;
    font-weight:bold;
    margin-bottom:10px;
    text-align:center;
  }

  .signout-btn {
    background:#d9534f;
    color:#fff;
    padding:12px 20px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    width:100%;
    font-size:18px;
    margin-top:10px;
  }

  .icon-row {
    position:fixed;
    bottom:10px;
    left:0;
    width:100%;
    display:flex;
    justify-content:center;
    gap:40px;
  }
  .icon-item {
    font-size:26px;
    opacity:0.9;
    cursor:pointer;
  }
</style>
</head>

<body>

<h1 style="margin-top:20px;">Profile 🧑</h1>

<div class="block">
  <div class="title">Team Member Result</div>
  <p><strong>Team Member Value:</strong> <span id="teamMembers"></span></p>
</div>

<div class="block">
  <button class="signout-btn" onclick="signOut()">Sign Out</button>
</div>

<div class="icon-row">
  <div class="icon-item" onclick="location.href='home.html'">🏠</div>
  <div class="icon-item" onclick="location.href='token.html'">🏅</div>
  <div class="icon-item" onclick="location.href='spinwheel.html'">🎡</div>
  <div class="icon-item" onclick="location.href='bingo.html'">🎯</div>
  <div class="icon-item" onclick="location.href='profile.html'">🧑</div>
</div>

<script>
const supabaseUrl = "https://zejhbfuuherovlxklrgy.supabase.co";
const supabaseKey = "sb_publishable_71MQZaR6QqWn1mH39fyoJQ_-sU8fmSQ";
const client = window.supabase.createClient(supabaseUrl, supabaseKey);

/* ⭐ TEAM MEMBER LOGIC ⭐ */
async function loadTeamMemberValue(referralCode) {

  const { data: rows, error } = await client
    .from("UsersSQL")
    .select("teammembers")
    .eq("referred_by", referralCode);

  if (error || !rows || rows.length === 0) {
    document.getElementById("teamMembers").textContent = "0";
    return;
  }

  const nums = rows
    .map(r => Number(r.teammembers))
    .filter(v => !Number.isNaN(v));

  if (nums.length === 0) {
    document.getElementById("teamMembers").textContent = "0";
    return;
  }

  const highest = Math.max(...nums);

  document.getElementById("teamMembers").textContent = highest;
}

/* ⭐ LOAD PROFILE ⭐ */
async function loadProfile() {

  let session = null;
  while (!session) {
    const { data } = await client.auth.getSession();
    session = data.session;
    await new Promise(r => setTimeout(r, 50));
  }

  const email = session.user.email;

  const { data: userRow, error } = await client
    .from("UsersSQL")
    .select("*")
    .eq("email", email)
    .single();

  if (error || !userRow) {
    alert("Error loading profile.");
    return;
  }

  await loadTeamMemberValue(userRow.referralcode);
}

async function signOut() {
  await client.auth.signOut();
  location.href = "signin.html";
}

loadProfile();
</script>

</body>
</html>
