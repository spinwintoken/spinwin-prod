<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Home - SpinWinToken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="page">

  <!-- TITLE -->
  <div class="logo-title">SPINWIN TOKEN</div>

  <!-- COUNTDOWN -->
  <div class="countdown-box">
    <div class="countdown-title">Spin Win Starts In</div>
    <div id="timer" class="timer">Loading...</div>
    <div class="countdown-info">
      Eastern Standard Time (ET)<br>
      Monday 8am • Thursday 8pm<br>
      84‑hour cycle
    </div>
  </div>

  <!-- MENU LIST (VERTICAL, CENTERED) -->
  <div class="menu-list">
    <div class="menu-item" onclick="go('home.html')">SPIN WIN TOKEN</div>
    <div class="menu-item" onclick="go('token.html')">Token</div>
    <div class="menu-item" onclick="go('spinwheel.html')">Spin Wheel</div>
    <div class="menu-item" onclick="go('bingo.html')">Bingo</div>
    <div class="menu-item" onclick="go('profile.html')">Profile</div>
    <div class="menu-item menu-close" onclick="closePage()">Close</div>
  </div>

</div>

<!-- BOTTOM ICON ROW (SMALL EMOJIS) -->
<div class="icon-row">
  <div class="icon-item">🏠</div>
  <div class="icon-item">🏅</div>
  <div class="icon-item">🍪</div>
  <div class="icon-item">⬡</div>
  <div class="icon-item">👤</div>
</div>

<script>
  function go(page) {
    window.location.href = page;
  }

  function closePage() {
    // for now just stay on page; you can change this later
    alert("Close pressed");
  }

  /* COUNTDOWN TIMER */
  function updateTimer() {
    const now = new Date();

    const monday = new Date();
    monday.setDate(now.getDate() + ((1 - now.getDay() + 7) % 7));
    monday.setHours(8,0,0,0);

    const thursday = new Date();
    thursday.setDate(now.getDate() + ((4 - now.getDay() + 7) % 7));
    thursday.setHours(20,0,0,0);

    let nextEvent;

    if (now < monday) nextEvent = monday;
    else if (now < thursday) nextEvent = thursday;
    else {
      monday.setDate(monday.getDate() + 7);
      nextEvent = monday;
    }

    const diff = nextEvent - now;

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("timer").textContent =
      `${hours}h ${minutes}m ${seconds}s`;
  }

  setInterval(updateTimer, 1000);
  updateTimer();
</script>

</body>
</html>
