<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SpinWin Home (Safe)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .box { border: 1px solid #ccc; padding: 16px; margin-bottom: 16px; border-radius: 8px; }
    .label { font-weight: bold; }
    .row { margin: 4px 0; }
    .timer { font-size: 24px; font-weight: bold; margin-top: 8px; }
    .status { margin-top: 8px; color: #006400; }
    .error { margin-top: 8px; color: #b00020; }
  </style>
  <script src="https://unpkg.com/@supabase/supabase-js@2.47.1/dist/umd/supabase.min.js"></script>
</head>
<body>
  <h1>SpinWin Home</h1>

  <!-- Display TokenSQL values -->
  <div class="box">
    <div class="label">TokenSQL (live)</div>
    <div class="row">token1: <span id="token1">-</span></div>
    <div class="row">token2: <span id="token2">-</span></div>
    <div class="row">priceindex: <span id="priceindex">-</span></div>
    <div class="row">token3: <span id="token3">-</span></div>
    <div class="row">spinpooltoken: <span id="spinpooltoken">-</span></div>
    <div class="row">spindate: <span id="spindate">-</span></div>
  </div>

  <!-- Timer + status -->
  <div class="box">
    <div class="label">Spin Timer</div>
    <div class="timer" id="timerDisplay">00:00</div>
    <div class="status" id="statusMessage"></div>
    <div class="error" id="errorMessage"></div>
  </div>

  <script>
    // --- Supabase client (publishable key, safe with RLS) ---
    const supabaseUrl = "https://zejhbfuuherovlxklrgy.supabase.co";
    const supabaseKey = "sb_publishable_71MQZaR6QqWn1mH39fyoJQ_-sU8fmSQ";
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    // --- Helper: load TokenSQL row and display it ---
    async function loadTokenSQL() {
      const errorEl = document.getElementById("errorMessage");
      const statusEl = document.getElementById("statusMessage");
      errorEl.textContent = "";
      statusEl.textContent = "";

      const { data, error } = await supabaseClient
        .from("TokenSQL")
        .select("*")
        .limit(1)
        .maybeSingle();

      if (error) {
        errorEl.textContent = "Error loading TokenSQL: " + error.message;
        return null;
      }

      if (!data) {
        errorEl.textContent = "No TokenSQL row found.";
        return null;
      }

      document.getElementById("token1").textContent = data.token1 ?? "-";
      document.getElementById("token2").textContent = data.token2 ?? "-";
      document.getElementById("priceindex").textContent = data.priceindex ?? "-";
      document.getElementById("token3").textContent = data.token3 ?? "-";
      document.getElementById("spinpooltoken").textContent = data.spinpooltoken ?? "-";
      document.getElementById("spindate").textContent = data.spindate ?? "-";

      return data;
    }

    // --- Timer logic: every X seconds, try to move 1000 from token3 to spinpooltoken ---
    const TIMER_INTERVAL_MS = 30_000; // 30 seconds example
    let remainingSeconds = TIMER_INTERVAL_MS / 1000;
    let timerIntervalId = null;
    let tickIntervalId = null;

    function startTimer() {
      const timerEl = document.getElementById("timerDisplay");
      const statusEl = document.getElementById("statusMessage");
      const errorEl = document.getElementById("errorMessage");

      statusEl.textContent = "Timer running...";
      errorEl.textContent = "";

      // Visual countdown
      remainingSeconds = TIMER_INTERVAL_MS / 1000;
      timerEl.textContent = formatSeconds(remainingSeconds);

      if (tickIntervalId) clearInterval(tickIntervalId);
      tickIntervalId = setInterval(() => {
        remainingSeconds -= 1;
        if (remainingSeconds < 0) remainingSeconds = 0;
        timerEl.textContent = formatSeconds(remainingSeconds);
      }, 1000);

      // When interval completes, run the spin logic
      if (timerIntervalId) clearInterval(timerIntervalId);
      timerIntervalId = setInterval(async () => {
        await runSpinCycle();
        // restart countdown
        remainingSeconds = TIMER_INTERVAL_MS / 1000;
      }, TIMER_INTERVAL_MS);
    }

    function formatSeconds(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, "0");
      const s = String(sec % 60).padStart(2, "0");
      return `${m}:${s}`;
    }

    // --- Core spin logic: safe SELECT + UPDATE on TokenSQL ---
    async function runSpinCycle() {
      const statusEl = document.getElementById("statusMessage");
      const errorEl = document.getElementById("errorMessage");
      statusEl.textContent = "";
      errorEl.textContent = "";

      // 1. Read current TokenSQL row (needs SELECT policy)
      const { data, error } = await supabaseClient
        .from("TokenSQL")
        .select("*")
        .limit(1)
        .maybeSingle();

      if (error) {
        errorEl.textContent = "Spin error (read): " + error.message;
        return;
      }
      if (!data) {
        errorEl.textContent = "Spin error: no TokenSQL row.";
        return;
      }

      const currentToken3 = Number(data.token3 ?? 0);
      const currentSpinPool = Number(data.spinpooltoken ?? 0);

      // 2. Check rule: only move if token3 >= 1000
      if (currentToken3 < 1000) {
        statusEl.textContent = "Spin skipped: token3 < 1000.";
        await loadTokenSQL();
        return;
      }

      const newToken3 = currentToken3 - 1000;
      const newSpinPool = currentSpinPool + 1000;

      // 3. Update TokenSQL (needs UPDATE policy with using = true)
      const { error: updateError } = await supabaseClient
        .from("TokenSQL")
        .update({
          token3: newToken3,
          spinpooltoken: newSpinPool,
          spindate: new Date().toISOString()
        })
        .eq("id", data.id); // assumes TokenSQL has primary key "id"

      if (updateError) {
        errorEl.textContent = "Spin error (update): " + updateError.message;
        return;
      }

      statusEl.textContent = "Spin success: moved 1000 from token3 to spinpooltoken.";
      await loadTokenSQL();
    }

    // --- On page load: load data and start timer ---
    (async () => {
      await loadTokenSQL();
      startTimer();
    })();
  </script>
</body>
</html>
