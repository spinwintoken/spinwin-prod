<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Home - SpinWinToken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    background:#000;
    color:#ffd700;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
  }

  /* Logo + SPINWIN TOKEN */
  .logo-box {
    margin-top:20px;
  }
  .logo-box img {
    width:140px;   /* same size as your previous layout */
  }
  .logo-title {
    font-size:26px;
    font-weight:bold;
    margin-top:8px;
    color:#ffd700;
  }

  /* Countdown Section */
  .countdown-box {
    margin-top:20px;
    padding:20px;
    background:#111;
    border:1px solid #ffd700;
    border-radius:10px;
    width:90%;
    max-width:420px;
    margin-left:auto;
    margin-right:auto;
  }

  .countdown-title {
    font-size:20px;
    margin-bottom:10px;
  }

  .timer {
    font-size:32px;
    font-weight:bold;
    margin-top:10px;
  }

  /* Bricks */
  .brick {
    width:90%;
    max-width:420px;
    margin:15px auto;
    padding:25px;
    border-radius:12px;
    font-size:22px;
    font-weight:bold;
    cursor:pointer;
    color:#000;
    text-align:center;
  }

  /* NOT SOLID COLORS — new gradient style */
  .brick-big {
    background:linear-gradient(135deg, #ffd700, #ffef9f);
  }

  .brick-token {
    background:linear-gradient(135deg, #ff6f61, #ffb3a8);
  }

  .brick-spinwheel {
    background:linear-gradient(135deg, #61c1ff, #a8e1ff);
  }

  .brick-bingo {
    background:linear-gradient(135deg, #7dff61, #c8ffb3);
  }

  .brick-profile {
    background:linear-gradient(135deg, #c561ff, #e6b3ff);
  }

  /* Two‑brick rows */
  .brick-row {
    display:flex;
    justify-content:center;
    gap:20px;
    margin-top:20px;
  }

  .brick-small {
    flex:1;
    max-width:180px;
    padding:25px;
    border-radius:12px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
    color:#000;
    text-align:center;
  }
</style>
</head>

<body>

<!-- Logo -->
<div class="logo-box">
  <img src="images/logo.png">
  <div class="logo-title">SPINWIN TOKEN</div>
</div>

<!-- Countdown -->
<div class="countdown-box">
  <div class="countdown-title">Spin Win Starts In</div>
  <div id="timer" class="timer">Loading...</div>
  <div style="margin-top:10px; font-size:14px;">
    Eastern Standard Time (ET)<br>
    Monday 8am • Thursday 8pm<br>
    84‑hour cycle
  </div>
</div>

<!-- FIRST ROW — restored text -->
<div class="brick brick-big" onclick="openPage('SPIN WIN TOKEN')">
  SPIN WIN TOKEN
</div>

<!-- SECOND ROW -->
<div class="brick-row">
  <div class="brick-small brick-token" onclick="go('token.html')">Token</div>
  <div class="brick-small brick-spinwheel" onclick="go('spinwheel.html')">Spin Wheel</div>
</div>

<!-- THIRD ROW -->
<div class="brick-row">
  <div class="brick-small brick-bingo" onclick="go('bingo.html')">Bingo</div>
  <div class="brick-small brick-profile" onclick="go('profile.html')">Profile</div>
</div>

<script>
  /* Navigation */
  function go(page) {
    window.location.href = page;
  }

  /* Countdown Timer */
  function updateTimer() {
    const now = new Date();

    const monday = new Date();
    monday.setDate(now.getDate() + ((1 - now.getDay() + 7) % 7));
    monday.setHours(8,0,0,0);

    const thursday = new Date();
    thursday.setDate(now.getDate() + ((4 - now.getDay() + 7) % 7));
    thursday.setHours(20,0,0,0);

    let nextEvent;

    if (now < monday) nextEvent = monday;
    else if (now < thursday) nextEvent = thursday;
    else {
      monday.setDate(monday.getDate() + 7);
      nextEvent = monday;
    }

    const diff = nextEvent - now;

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("timer").textContent =
      `${hours}h ${minutes}m ${seconds}s`;
  }

  setInterval(updateTimer, 1000);
  updateTimer();
</script>

</body>
</html>
