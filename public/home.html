<script>
  function updateTimer() {
    const now = new Date();

    // Convert to ET (assuming server/user may not be ET)
    const nowET = new Date(
      now.toLocaleString("en-US", { timeZone: "America/New_York" })
    );

    const day = nowET.getDay(); // 0=Sun,1=Mon,...,4=Thu
    const hour = nowET.getHours();

    let nextEventET;

    // Build Monday 8am ET of this week
    const mondayET = new Date(nowET);
    mondayET.setDate(nowET.getDate() + ((1 - day + 7) % 7));
    mondayET.setHours(8, 0, 0, 0);

    // Build Thursday 8pm ET of this week
    const thursdayET = new Date(nowET);
    thursdayET.setDate(nowET.getDate() + ((4 - day + 7) % 7));
    thursdayET.setHours(20, 0, 0, 0);

    // 84-hour cycle: Monday 8am → Thursday 8pm
    // If before Monday 8am → count to Monday 8am
    // If between Monday 8am and Thursday 8pm → count to Thursday 8pm
    // If after Thursday 8pm → next Monday 8am (add 7 days)
    if (nowET < mondayET) {
      nextEventET = mondayET;
    } else if (nowET >= mondayET && nowET < thursdayET) {
      nextEventET = thursdayET;
    } else {
      // After Thursday 8pm → next Monday 8am
      mondayET.setDate(mondayET.getDate() + 7);
      nextEventET = mondayET;
    }

    const diff = nextEventET - nowET;

    const hours = Math.floor(diff / (1000 * 60 * 60));
    const minutes = Math.floor((diff / (1000 * 60)) % 60);
    const seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("timer").textContent =
      `${hours}h ${minutes}m ${seconds}s`;

    // When timer hits zero (or very close), trigger spin
    if (diff <= 1000) {
      runSpinCycle();
    }
  }

  setInterval(updateTimer, 1000);
  updateTimer();
</script>
