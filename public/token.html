<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Token - SpinWinToken</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<style>
  body {
    background:#000;
    color:#ffd700;
    font-family:Arial, sans-serif;
    margin:0;
    padding:0;
    text-align:center;
    padding-bottom:90px;
  }

  .price-box {
    margin-top:20px;
    padding:20px;
    background:#111;
    border:1px solid #ffd700;
    border-radius:10px;
    width:90%;
    max-width:420px;
    margin-left:auto;
    margin-right:auto;
    text-align:center;
  }

  table {
    width:100%;
    color:#ffd700;
    font-size:14px;
    border-collapse:collapse;
  }
  td {
    border:1px solid #ffd700;
    padding:10px;
  }

  .input-box {
    padding:10px;
    width:140px;
    border-radius:8px;
    border:1px solid #ffd700;
    background:#222;
    color:#ffd700;
    text-align:center;
    -moz-appearance: textfield;
  }
  .input-box::-webkit-inner-spin-button,
  .input-box::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .arrow-column {
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .arrow-btn {
    background:#ffd700;
    color:#000;
    border:none;
    padding:6px 10px;
    font-size:20px;
    border-radius:6px;
    cursor:pointer;
  }
</style>
</head>

<body>

<h1 style="margin-top:20px;">SPINWIN TOKEN</h1>

<!-- PRICE + TOKEN TABLE -->
<div class="price-box">
  <div class="price-title">TOKEN</div>

  <div class="price-sub">
    Price Index = <span id="priceindexValue">-</span>
    <span style="font-size:10px;">USDT</span>
  </div>

  <table>
    <tr>
      <td><strong>For Purchase</strong></td>
      <td><strong>Reward</strong></td>
      <td><strong>SPIN WIN</strong></td>
    </tr>
    <tr>
      <td>TOTAL TOKENS: 10,000,000</td>
      <td>TOTAL TOKENS: 1,000,000</td>
      <td>TOTAL TOKENS: 10,000,000</td>
    </tr>
    <tr>
      <td><span id="token1Value"></span></td>
      <td><span id="token2Value">★★★★★</span></td>
      <td><span id="spinwintokenValue"></span></td>
    </tr>
  </table>
</div>

<!-- PURCHASE TOKENS -->
<div class="price-box">
  <div class="price-title">PURCHASE TOKENS</div>

  <div style="margin-top:10px; font-size:16px;">
    Minimum 0.0005
  </div>

  <div style="margin-top:20px;">
    <label style="font-size:16px;">Enter Token Amount</label><br><br>

    <div style="display:flex; justify-content:center; align-items:center; gap:20px;">
      
      <input 
        id="buyAmount"
        type="number"
        step="0.0001"
        min="0.0005"
        placeholder="0.0005"
        class="input-box"
      />

      <div class="arrow-column">
        <button class="arrow-btn" onclick="increaseAmount()">▲</button>
        <button class="arrow-btn" onclick="decreaseAmount()">▼</button>
      </div>

    </div>

    <br><br>

    <button onclick="buyTokens()" 
      style="padding:10px 20px; background:#ffd700; color:#000; border:none; border-radius:8px; cursor:pointer;">
      Buy Tokens
    </button>
  </div>
</div>

<!-- TEAM TOKEN PURCHASED -->
<div class="price-box">
  <div class="price-title">TEAM TOKEN PURCHASED</div>

  <table style="margin-top:20px; width:100%;">
    <tr>
      <td>Team Token Purchased</td>
      <td><span id="teamtokenpurchasedValue">-</span></td>
    </tr>
  </table>
</div>

<!-- SUPABASE -->
<script src="https://unpkg.com/@supabase/supabase-js@2.47.1/dist/umd/supabase.min.js"></script>
<script>

  const supabase = supabase.createClient(
    "https://zejhbfuuherovlxklrgy.supabase.co",
    "sb_publishable_71MQZaR6QqWn1mH39fyoJQ_-sU8fmSQ"
  );

  async function checkUser() {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) location.href = "signin.html";
    return user;
  }

  async function loadTokenData() {
    const { data } = await supabase
      .from("TokenSQL")
      .select("token1, priceindex")
      .limit(1)
      .maybeSingle();

    if (!data) return;

    document.getElementById("token1Value").textContent = data.token1 ?? "-";
    document.getElementById("priceindexValue").textContent = data.priceindex ?? "-";
  }

  async function loadUserData() {
    const user = await checkUser();
    const { data } = await supabase
      .from("UsersSQL")
      .select("teamtokenpurchased, spinwintoken")
      .eq("uid", user.id)
      .maybeSingle();

    if (!data) return;

    document.getElementById("teamtokenpurchasedValue").textContent = data.teamtokenpurchased ?? "-";
    document.getElementById("spinwintokenValue").textContent = data.spinwintoken ?? "-";
  }

  loadTokenData();
  loadUserData();

  // ⭐ AUTO‑REFRESH EVERY 5 SECONDS
  setInterval(() => {
    loadTokenData();
    loadUserData();
  }, 5000);

  function increaseAmount() {
    let v = parseFloat(document.getElementById("buyAmount").value || "0.0005");
    v += 0.0001;
    document.getElementById("buyAmount").value = v.toFixed(4);
  }

  function decreaseAmount() {
    let v = parseFloat(document.getElementById("buyAmount").value || "0.0005");
    v -= 0.0001;
    if (v < 0.0005) v = 0.0005;
    document.getElementById("buyAmount").value = v.toFixed(4);
  }

  function buyTokens() {
    const v = document.getElementById("buyAmount").value;

    if (v.includes(".")) {
      const decimals = v.split(".")[1].length;
      if (decimals > 4) {
        alert("Value cannot be more than 4 decimals.");
        return;
      }
    }

    if (parseFloat(v) < 0.0005) {
      alert("Minimum purchase is 0.0005");
      return;
    }

    alert("Purchase successful: " + v + " tokens");
  }

</script>

</body>
</html>
